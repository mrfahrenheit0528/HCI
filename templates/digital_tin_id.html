<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PorTaxPH - Official Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/pages/digital_tin_id.css') }}"
    />
  </head>

  <body class="min-h-screen flex flex-col">
    <!-- TOP NAVIGATION REMOVED FOR FORMS -->
 
    <div class="tin-id-page-wrapper">
      <div class="hero-bg tin-id-hero">
        <div class="absolute inset-0 bir-gradient-overlay z-0"></div>

        <div class="tin-id-nav-container">
          <a href="orus_home.html" class="tin-id-back-link group">
            <svg class="tin-id-back-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span class="tin-id-back-text">Back to Home</span>
          </a>
        </div>

        <div class="tin-id-header-container reveal">
          <div class="flex items-center justify-center text-center">
            <div>
              <h1 class="tin-id-title">Digital TIN ID</h1>
              <p class="tin-id-subtitle">
                Generate your official digital TIN ID card.
              </p>
            </div>
          </div>
        </div>
      </div>

      <div class="tin-id-content-section reveal">
        <div class="tin-id-card-white">
          <div class="tin-id-display-area">
            <div class="digital-tin-id-card">
              <div class="tin-id-card-header">
                <div class="tin-id-bir-text">
                  Bureau of Internal Revenue<br />Digital TIN ID
                </div>
                <div class="tin-id-portax-text">PorTaxPH</div>
              </div>
              <div class="tin-id-card-body">
                <div class="tin-id-photo-placeholder"></div>
                <div>
                  <div class="tin-id-name">DELA CRUZ, JUAN P.</div>
                  <div class="tin-id-number">123-456-789</div>
                </div>
              </div>
              <div class="tin-id-card-footer">
                Verified On: 20 FEB 2024
              </div>
            </div>
            <button class="download-id-btn">
              Download Digital ID
            </button>
          </div>
        </div>
      </div>
    </div>

    {% include "partials/footer.html" %}
    <script src="{{ url_for('static', filename='js/global_animations.js') }}"></script>
  </body>
</html>
