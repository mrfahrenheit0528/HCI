<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PorTaxPH - Official Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/pages/digital_tin_id.css') }}"
    />
  </head>

  <body class="min-h-screen flex flex-col">
    <!-- TOP NAVIGATION REMOVED FOR FORMS -->
 
    <div class="flex-grow bg-slate-50">
      <div
        class="hero-bg py-16 px-6 md:px-24 text-white relative overflow-hidden"
      >
        <div class="absolute inset-0 bir-gradient-overlay z-0"></div>

        <div class="max-w-7xl mx-auto relative z-10 mb-8">
          <a href="orus_home.html" class="inline-flex items-center gap-2 text-white/60 hover:text-white transition-colors group">
            <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span class="text-xs font-black uppercase tracking-widest">Back to Home</span>
          </a>
        </div>

        <div class="max-w-7xl mx-auto relative z-10 reveal">
          <div class="flex items-center justify-center text-center">
            <div>
              <h1 class="text-3xl md:text-5xl font-black mb-1 tracking-tight text-center">Digital TIN ID</h1>
              <p class="text-blue-100 opacity-80 max-w-3xl text-sm md:text-base text-center mx-auto">
                Generate your official digital TIN ID card.
              </p>
            </div>
          </div>
        </div>
      </div>

      <div class="max-w-4xl mx-auto px-6 -mt-10 mb-24 reveal">
        <div class="bg-white rounded shadow-2xl p-10 min-h-[400px]">
          <div class="flex flex-col items-center py-10">
            <div
              class="w-full max-w-sm bg-blue-900 rounded-xl p-6 text-white mb-10 shadow-2xl relative overflow-hidden"
            >
              <div class="flex justify-between items-start mb-6">
                <div class="text-[8px] font-black leading-tight uppercase">
                  Bureau of Internal Revenue<br />Digital TIN ID
                </div>
                <div class="text-[8px] font-bold opacity-50">PorTaxPH</div>
              </div>
              <div class="flex gap-4 mb-6">
                <div
                  class="w-20 h-24 bg-white/10 rounded border border-white/20"
                ></div>
                <div>
                  <div class="text-[10px] font-bold mb-2">
                    DELA CRUZ, JUAN P.
                  </div>
                  <div class="text-lg font-black tracking-widest">
                    123-456-789
                  </div>
                </div>
              </div>
              <div class="text-[7px] text-white/40">
                Verified On: 20 FEB 2024
              </div>
            </div>
            <button
              class="bg-[#03297b] text-white px-12 py-3 rounded font-bold uppercase tracking-widest text-xs"
            >
              Download Digital ID
            </button>
          </div>
        </div>
      </div>
    </div>

    {% include "partials/footer.html" %}
    <script src="{{ url_for('static', filename='js/global_animations.js') }}"></script>
  </body>
</html>
