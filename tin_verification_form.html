<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIR ORUS 2.0 - TIN Verification Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* slate-50 */
            color: #1e293b;
        }

        .input-base {
            @apply w-full px-4 py-3 bg-[#f8fafc] border-2 border-[#e2e8f0] rounded-xl text-slate-900 focus:outline-none focus:border-[#244093] focus:bg-white focus:ring-4 focus:ring-[#244093]/10 transition-all duration-200 text-sm font-semibold placeholder:text-slate-400 hover:border-slate-300 hover:bg-white;
        }

        .label-base {
            @apply block text-[11px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1;
        }

        /* Checkbox styling */
        .custom-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            background-color: #fff;
            border: 2px solid #cbd5e1;
            border-radius: 0.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .custom-checkbox:checked {
            background-color: #03297b;
            border-color: #03297b;
        }

        .custom-checkbox:checked::after {
            content: '';
            width: 0.35rem;
            height: 0.65rem;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 0.1rem;
        }

        /* Radio styling */
        .custom-radio {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            background-color: #fff;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .custom-radio:checked {
            border-color: #03297b;
        }

        .custom-radio:checked::after {
            content: '';
            width: 0.65rem;
            height: 0.65rem;
            background-color: #03297b;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Form segment animations */
        .form-segment {
            transition: opacity 0.3s ease, transform 0.3s ease;
            height: auto;
            overflow: hidden;
            opacity: 1;
            transform: translateY(0);
        }

        .form-segment.hidden-segment {
            height: 0;
            opacity: 0;
            padding: 0;
            margin: 0;
            transform: translateY(-10px);
            pointer-events: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">
    <!-- TOP NAVIGATION -->
    <nav class="bg-white border-b sticky top-0 z-50 px-6 py-4 md:px-24 flex items-center justify-between shadow-sm">
        <a href="orus_home.html" class="flex items-center gap-4 cursor-pointer">
            <img src="orus_logo.png" alt="ORUS Logo" class="h-9 w-auto"
                onerror="this.src='https://placehold.co/120x40?text=ORUS'">
        </a>

        <div class="flex items-center gap-6">
            <a href="tin_verification.html"
                class="text-xs font-bold text-slate-500 hover:text-[#03297b] uppercase tracking-wider flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Options
            </a>
        </div>
    </nav>

    <div class="flex-grow flex flex-col items-center py-12 px-4 md:px-8 max-w-[1400px] mx-auto w-full">

        <!-- White Form Card -->
        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 w-full max-w-3xl overflow-hidden">
            <!-- Header -->
            <div class="bg-slate-50 border-b border-slate-100 px-8 py-6 text-center">
                <h1 class="text-2xl font-black text-slate-800 flex items-center justify-center gap-3">
                    <svg class="w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    TIN Verification
                </h1>
            </div>

            <!-- Form Body -->
            <div class="p-8 md:p-12">
                <!-- Classification Toggle -->
                <div class="mb-10">
                    <label class="label-base text-center mb-4">Select Taxpayer's Classification <span
                            class="text-red-500">*</span></label>
                    <div class="flex flex-col sm:flex-row gap-4 bg-slate-50 p-2 rounded-xl border border-slate-200">
                        <label class="flex-1 relative">
                            <input type="radio" name="classification" value="individual" class="peer sr-only" checked
                                onchange="toggleFormType()">
                            <div
                                class="text-center px-4 py-3 rounded-lg text-sm font-bold text-slate-500 cursor-pointer transition-all peer-checked:bg-white peer-checked:text-[#03297b] peer-checked:shadow-sm peer-checked:border peer-checked:border-blue-100 flex items-center justify-center gap-3">
                                <div
                                    class="w-4 h-4 rounded-full border-2 border-slate-300 peer-checked:border-[#03297b] flex items-center justify-center relative inner-radio">
                                    <div class="w-2 h-2 rounded-full bg-[#03297b] opacity-0 transition-opacity"></div>
                                </div>
                                <span class="mt-px">Individual</span>
                            </div>
                        </label>
                        <label class="flex-1 relative">
                            <input type="radio" name="classification" value="non-individual" class="peer sr-only"
                                onchange="toggleFormType()">
                            <div
                                class="text-center px-4 py-3 rounded-lg text-sm font-bold text-slate-500 cursor-pointer transition-all peer-checked:bg-white peer-checked:text-[#03297b] peer-checked:shadow-sm peer-checked:border peer-checked:border-blue-100 flex items-center justify-center gap-3">
                                <div
                                    class="w-4 h-4 rounded-full border-2 border-slate-300 peer-checked:border-[#03297b] flex items-center justify-center relative inner-radio">
                                    <div class="w-2 h-2 rounded-full bg-[#03297b] opacity-0 transition-opacity"></div>
                                </div>
                                <span class="mt-px">Non-Individual</span>
                            </div>
                        </label>
                    </div>
                </div>

                <style>
                    /* Custom handling for the radio buttons inner circle inside the label div */
                    input[type="radio"]:checked+div .inner-radio div {
                        opacity: 1;
                    }
                </style>

                <!-- INDIVIDUAL FORM SEGMENT -->
                <div id="individual-form" class="form-segment pt-2">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="relative w-full">
                            <input type="text" id="first_name"
                                class="block px-4 py-3 w-full bg-[#f8fafc] border-2 border-[#e2e8f0] rounded-xl text-slate-900 focus:outline-none focus:border-[#244093] focus:bg-white focus:ring-4 focus:ring-[#244093]/10 transition-all duration-200 text-sm font-semibold peer hover:border-slate-300 hover:bg-white"
                                placeholder=" ">
                            <label for="first_name"
                                class="absolute text-sm font-bold text-slate-500 duration-200 transform -translate-y-4 scale-75 top-2 z-10 origin-left left-4 px-1 peer-focus:text-[#244093] peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 pointer-events-none rounded-sm bg-white peer-placeholder-shown:bg-transparent">First
                                Name <span class="text-red-500">*</span></label>
                        </div>
                        <div class="relative w-full">
                            <input type="text" id="last_name"
                                class="block px-4 py-3 w-full bg-[#f8fafc] border-2 border-[#e2e8f0] rounded-xl text-slate-900 focus:outline-none focus:border-[#244093] focus:bg-white focus:ring-4 focus:ring-[#244093]/10 transition-all duration-200 text-sm font-semibold peer hover:border-slate-300 hover:bg-white"
                                placeholder=" ">
                            <label for="last_name"
                                class="absolute text-sm font-bold text-slate-500 duration-200 transform -translate-y-4 scale-75 top-2 z-10 origin-left left-4 px-1 peer-focus:text-[#244093] peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 pointer-events-none rounded-sm bg-white peer-placeholder-shown:bg-transparent">Last
                                Name <span class="text-red-500">*</span></label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="w-full">
                            <div class="relative w-full mb-3">
                                <input type="text" id="middle-name"
                                    class="block px-4 py-3 w-full bg-[#f8fafc] border-2 border-[#e2e8f0] rounded-xl text-slate-900 focus:outline-none focus:border-[#244093] focus:bg-white focus:ring-4 focus:ring-[#244093]/10 transition-all duration-200 text-sm font-semibold peer hover:border-slate-300 hover:bg-white"
                                    placeholder=" ">
                                <label for="middle-name"
                                    class="absolute text-sm font-bold text-slate-500 duration-200 transform -translate-y-4 scale-75 top-2 z-10 origin-left left-4 px-1 peer-focus:text-[#244093] peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 pointer-events-none rounded-sm bg-white peer-placeholder-shown:bg-transparent">Middle
                                    Name</label>
                            </div>
                            <label class="flex items-center gap-2 cursor-pointer group ml-1">
                                <input type="checkbox" class="custom-checkbox"
                                    onchange="document.getElementById('middle-name').disabled = this.checked">
                                <span
                                    class="text-[11px] font-bold text-slate-500 group-hover:text-[#244093] transition-colors mt-px uppercase tracking-wider">I
                                    do not have a middle name</span>
                            </label>
                        </div>
                        <div class="relative w-full">
                            <select
                                class="block px-4 py-3 w-full bg-[#f8fafc] border-2 border-[#e2e8f0] rounded-xl text-slate-900 focus:outline-none focus:border-[#244093] focus:bg-white focus:ring-4 focus:ring-[#244093]/10 transition-all duration-200 text-sm font-semibold peer hover:border-slate-300 hover:bg-white cursor-pointer appearance-none">
                                <option value="" disabled selected hidden></option>
                                <option value="jr">Jr.</option>
                                <option value="sr">Sr.</option>
                                <option value="ii">II</option>
                                <option value="iii">III</option>
                                <option value="iv">IV</option>
                            </select>
                            <label
                                class="absolute text-sm font-bold text-slate-500 transform -translate-y-4 scale-75 top-2 z-10 origin-left left-4 bg-white px-1 pointer-events-none rounded-sm">Suffix
                                (if applicable)</label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 mt-2">
                        <div class="relative w-full">
                            <input type="date"
                                class="block px-4 py-3 w-full bg-[#f8fafc] border-2 border-[#e2e8f0] rounded-xl text-slate-900 focus:outline-none focus:border-[#244093] focus:bg-white focus:ring-4 focus:ring-[#244093]/10 transition-all duration-200 text-sm font-semibold peer hover:border-slate-300 hover:bg-white text-slate-500">
                            <label
                                class="absolute text-sm font-bold text-slate-500 transform -translate-y-4 scale-75 top-2 z-10 origin-left left-4 bg-white px-1 pointer-events-none rounded-sm">Date
                                of Birth <span class="text-red-500">*</span></label>
                        </div>
                        <div class="relative w-full">
                            <select
                                class="block px-4 py-3 w-full bg-[#f8fafc] border-2 border-[#e2e8f0] rounded-xl text-slate-900 focus:outline-none focus:border-[#244093] focus:bg-white focus:ring-4 focus:ring-[#244093]/10 transition-all duration-200 text-sm font-semibold peer hover:border-slate-300 hover:bg-white cursor-pointer appearance-none">
                                <option value="" disabled selected hidden></option>
                                <option value="m">Male</option>
                                <option value="f">Female</option>
                            </select>
                            <label
                                class="absolute text-sm font-bold text-slate-500 transform -translate-y-4 scale-75 top-2 z-10 origin-left left-4 bg-white px-1 pointer-events-none rounded-sm">Gender
                                <span class="text-red-500">*</span></label>
                        </div>
                    </div>
                </div>

                <!-- NON-INDIVIDUAL FORM SEGMENT -->
                <div id="non-individual-form" class="form-segment hidden-segment mb-8 pt-2">
                    <div class="w-full">
                        <div class="relative w-full">
                            <input type="text" id="registered_name"
                                class="block px-4 py-3 w-full bg-[#f8fafc] border-2 border-[#e2e8f0] rounded-xl text-slate-900 focus:outline-none focus:border-[#244093] focus:bg-white focus:ring-4 focus:ring-[#244093]/10 transition-all duration-200 text-sm font-semibold peer hover:border-slate-300 hover:bg-white"
                                placeholder=" ">
                            <label for="registered_name"
                                class="absolute text-sm font-bold text-slate-500 duration-200 transform -translate-y-4 scale-75 top-2 z-10 origin-left left-4 px-1 peer-focus:text-[#244093] peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 pointer-events-none rounded-sm bg-white peer-placeholder-shown:bg-transparent">Registered
                                Name <span class="text-red-500">*</span></label>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-2 italic ml-1">Note: Please enter the exact registered
                            name
                            as it appears on official BIR documents.</p>
                    </div>
                </div>

                <!-- COMMON FIELDS (TIN Input) -->
                <div class="border-t border-slate-100 pt-8 mb-8">
                    <label class="label-base text-center mb-6">Enter Taxpayer Identification Number (TIN) <span
                            class="text-red-500">*</span></label>
                    <div class="flex justify-center gap-3 md:gap-6">
                        <input type="text" maxlength="3"
                            class="input-base text-center text-lg font-bold tracking-widest w-20 md:w-28"
                            placeholder="###"
                            onkeyup="if(this.value.length==3) document.getElementById('tin2').focus()">
                        <span class="text-slate-400 font-bold self-center">-</span>
                        <input type="text" id="tin2" maxlength="3"
                            class="input-base text-center text-lg font-bold tracking-widest w-20 md:w-28"
                            placeholder="###"
                            onkeyup="if(this.value.length==3) document.getElementById('tin3').focus()">
                        <span class="text-slate-400 font-bold self-center">-</span>
                        <input type="text" id="tin3" maxlength="3"
                            class="input-base text-center text-lg font-bold tracking-widest w-20 md:w-28"
                            placeholder="###">
                    </div>
                </div>

                <!-- Mock reCAPTCHA -->
                <div class="flex justify-center mb-8">
                    <div
                        class="border border-slate-200 rounded-md bg-slate-50 p-4 flex items-center justify-between w-full max-w-sm shadow-sm cursor-pointer hover:bg-slate-100 transition-colors">
                        <label class="flex items-center gap-4 cursor-pointer">
                            <input type="checkbox"
                                class="w-6 h-6 rounded border-slate-300 text-green-500 focus:ring-green-500 cursor-pointer">
                            <span class="text-sm font-medium text-slate-700">I'm not a robot</span>
                        </label>
                        <div class="flex flex-col items-center">
                            <svg class="w-8 h-8 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z" />
                            </svg>
                            <span class="text-[8px] text-slate-400">reCAPTCHA</span>
                        </div>
                    </div>
                </div>

                <!-- CTA -->
                <button onclick="showRecordFound()"
                    class="w-full bg-[#f5b026] text-[#011a4d] py-4 rounded-xl font-black uppercase tracking-widest text-sm shadow-md hover:bg-yellow-400 hover:shadow-lg transition-all flex items-center justify-center gap-2 relative overflow-hidden group">
                    <span class="relative z-10 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        Verify TIN
                    </span>
                    <div
                        class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- RECORD FOUND MODAL -->
    <div id="record-modal"
        class="fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-sm hidden hidden-modal flex items-center justify-center px-4 transition-opacity duration-300 opacity-0">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl flex flex-col relative overflow-hidden transform scale-95 transition-transform duration-300"
            id="modal-content">

            <!-- Close Button (X) -->
            <button onclick="hideRecordFound()"
                class="absolute top-4 right-4 text-white hover:text-slate-200 transition-colors z-20">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <!-- Decorative Header Background -->
            <div class="h-32 bg-gradient-to-br from-[#244093] to-[#1e3a8a] relative overflow-hidden">
                <!-- Abstract geometric shapes for modern feel -->
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-[#f5b026]/20 rounded-full blur-xl"></div>
            </div>

            <!-- Content Area (Overlapping the header) -->
            <div class="px-8 pb-8 pt-0 -mt-16 relative z-10 flex flex-col items-center">
                <!-- Status Icon -->
                <div
                    class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-lg mb-4 border-4 border-white">
                    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center">
                        <svg class="w-10 h-10 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                </div>

                <!-- Titles -->
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-black text-slate-800 tracking-tight mb-1">Match Found</h2>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest" id="modal-date">Verified on
                        2/26/2026</p>
                </div>

                <!-- Data Cards -->
                <div class="space-y-3 w-full mb-8 text-left">
                    <!-- TIN -->
                    <div
                        class="bg-slate-50 border border-slate-100 p-4 rounded-xl flex items-center justify-between shadow-sm">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">TIN Record</span>
                        <span class="text-lg font-black text-[#244093] tracking-widest">123 - 456 - 789</span>
                    </div>

                    <!-- Registered Name -->
                    <div class="bg-slate-50 border border-slate-100 p-4 rounded-xl shadow-sm">
                        <span
                            class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Registered
                            Entity Name</span>
                        <span class="block text-sm font-black text-slate-800 uppercase tracking-wide">DELA CRUZ, JUAN
                            MIGUEL</span>
                    </div>

                    <!-- Status row -->
                    <div class="flex gap-3">
                        <div
                            class="bg-slate-50 border border-slate-100 p-4 rounded-xl flex-1 flex flex-col justify-center items-center gap-2 shadow-sm">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center">TIN
                                Status</span>
                            <span
                                class="px-3 py-1 bg-green-100 text-green-700 text-xs font-black uppercase rounded-full tracking-widest">Active</span>
                        </div>
                        <div
                            class="bg-slate-50 border border-slate-100 p-4 rounded-xl flex-1 flex flex-col justify-center items-center gap-2 shadow-sm">
                            <span
                                class="text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center">Remarks</span>
                            <span
                                class="text-sm font-black text-slate-700 flex items-center gap-1.5 uppercase tracking-wide">
                                <svg class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                Matched
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <button onclick="hideRecordFound()"
                    class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase tracking-widest text-sm shadow-md hover:bg-slate-800 hover:shadow-lg transition-all flex items-center justify-center gap-2 group">
                    Start New Search
                    <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        function toggleFormType() {
            const isIndividual = document.querySelector('input[name="classification"]:checked').value === 'individual';
            const individualForm = document.getElementById('individual-form');
            const nonIndividualForm = document.getElementById('non-individual-form');

            if (isIndividual) {
                nonIndividualForm.classList.add('hidden-segment');
                setTimeout(() => {
                    individualForm.classList.remove('hidden-segment');
                }, 300); // Wait for hiding animation
            } else {
                individualForm.classList.add('hidden-segment');
                setTimeout(() => {
                    nonIndividualForm.classList.remove('hidden-segment');
                }, 300);
            }
        }

        function showRecordFound() {
            // Update Date
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('modal-date').innerText = `Verified on ${today.toLocaleDateString('en-US', options)}`;

            const modal = document.getElementById('record-modal');
            const modalContent = document.getElementById('modal-content');

            // Un-hide
            modal.classList.remove('hidden');

            // Trigger animation
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function hideRecordFound() {
            const modal = document.getElementById('record-modal');
            const modalContent = document.getElementById('modal-content');

            // Reverse animation
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            // Hide completely after duration
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);

            // Reset form fields
            document.querySelectorAll('.input-base').forEach(input => input.value = '');
        }
    </script>
</body>

</html>
